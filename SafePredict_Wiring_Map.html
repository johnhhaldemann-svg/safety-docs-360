<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafePredict — Platform Wiring Map</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: #161b27;
    border-bottom: 1px solid #1e2740;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #f59e0b, #dc2626);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900; color: white;
  }
  .header h1 { font-size: 16px; font-weight: 700; color: #f1f5f9; }
  .header p { font-size: 11px; color: #64748b; margin-top: 1px; }

  /* ── Summary badges ── */
  .summary {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    transition: opacity 0.15s;
    border: 1px solid transparent;
  }
  .badge:hover { opacity: 0.8; }
  .badge.active { border-color: currentColor; }
  .badge-green { background: rgba(16,185,129,0.15); color: #10b981; }
  .badge-yellow { background: rgba(245,158,11,0.15); color: #f59e0b; }
  .badge-red { background: rgba(239,68,68,0.15); color: #ef4444; }
  .badge-gray { background: rgba(100,116,139,0.15); color: #94a3b8; }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  /* ── Filters ── */
  .filter-bar {
    background: #161b27;
    border-bottom: 1px solid #1e2740;
    padding: 10px 24px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .filter-btn {
    background: #1e2740;
    border: 1px solid #2d3a55;
    color: #94a3b8;
    padding: 5px 14px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: #2d3a55;
    color: #e2e8f0;
    border-color: #3d4f73;
  }
  .filter-label { font-size: 12px; color: #475569; margin-right: 4px; }
  .search-box {
    margin-left: auto;
    background: #1e2740;
    border: 1px solid #2d3a55;
    color: #e2e8f0;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px;
    width: 200px;
    outline: none;
  }
  .search-box::placeholder { color: #475569; }
  .search-box:focus { border-color: #3b82f6; }

  /* ── Main layout ── */
  .main {
    display: flex;
    height: calc(100vh - 105px);
  }

  /* ── Zones panel ── */
  .zones {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    grid-auto-rows: min-content;
    gap: 16px;
    align-content: start;
  }

  .zone {
    background: #161b27;
    border: 1px solid #1e2740;
    border-radius: 10px;
    overflow: hidden;
  }
  .zone-header {
    padding: 10px 14px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #1e2740;
  }
  .zone-icon { font-size: 14px; }
  .zone-body { padding: 6px 0; }

  /* ── Wiring node ── */
  .node {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 14px;
    cursor: pointer;
    transition: background 0.1s;
    border-left: 3px solid transparent;
  }
  .node:hover {
    background: #1a2030;
  }
  .node.selected {
    background: #1a2030;
  }
  .node-indicator {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 4px;
  }
  .node.green .node-indicator  { background: #10b981; box-shadow: 0 0 6px rgba(16,185,129,0.5); }
  .node.yellow .node-indicator { background: #f59e0b; box-shadow: 0 0 6px rgba(245,158,11,0.5); }
  .node.red .node-indicator    { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.5); }
  .node.gray .node-indicator   { background: #475569; }

  .node.green  { border-left-color: #10b981; }
  .node.yellow { border-left-color: #f59e0b; }
  .node.red    { border-left-color: #ef4444; }
  .node.gray   { border-left-color: #475569; }

  .node-text { flex: 1; min-width: 0; }
  .node-name { font-size: 13px; font-weight: 600; color: #e2e8f0; line-height: 1.3; }
  .node-sub  { font-size: 11px; color: #64748b; margin-top: 2px; line-height: 1.4; }

  .node-tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 600;
    flex-shrink: 0;
    align-self: flex-start;
    margin-top: 2px;
  }
  .tag-green  { background: rgba(16,185,129,0.15);  color: #10b981; }
  .tag-yellow { background: rgba(245,158,11,0.15);  color: #f59e0b; }
  .tag-red    { background: rgba(239,68,68,0.15);   color: #ef4444; }
  .tag-gray   { background: rgba(100,116,139,0.15); color: #94a3b8; }

  /* ── Detail panel ── */
  .detail-panel {
    width: 360px;
    min-width: 360px;
    background: #161b27;
    border-left: 1px solid #1e2740;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.2s;
  }
  .detail-panel.hidden {
    width: 0;
    min-width: 0;
    border-left: none;
  }
  .detail-inner {
    padding: 20px;
    overflow-y: auto;
    height: 100%;
  }

  .detail-status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .detail-dot {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
  }
  .detail-status-text { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }

  .detail-name { font-size: 18px; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
  .detail-zone { font-size: 11px; color: #64748b; margin-bottom: 16px; }

  .detail-section { margin-bottom: 16px; }
  .detail-section-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #475569;
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid #1e2740;
  }
  .detail-desc { font-size: 13px; color: #94a3b8; line-height: 1.6; }

  .action-list { list-style: none; }
  .action-list li {
    font-size: 12px;
    color: #94a3b8;
    padding: 5px 0;
    border-bottom: 1px solid #1a2030;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    line-height: 1.4;
  }
  .action-list li:last-child { border-bottom: none; }
  .action-list .bullet {
    flex-shrink: 0;
    margin-top: 2px;
  }

  .env-tag {
    background: #1e2740;
    border: 1px solid #2d3a55;
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 11px;
    font-family: 'SF Mono', 'Cascadia Code', monospace;
    color: #7dd3fc;
    display: inline-block;
    margin: 2px 2px 2px 0;
  }

  .close-detail {
    position: absolute;
    top: 12px;
    right: 12px;
    background: #1e2740;
    border: none;
    color: #64748b;
    width: 26px; height: 26px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .close-detail:hover { background: #2d3a55; color: #e2e8f0; }
  .detail-header-row { position: relative; }

  /* hidden class for filtering */
  .node.hidden { display: none; }
  .zone.all-hidden { display: none; }

  /* pulse animation for red nodes */
  @keyframes pulse-red {
    0%, 100% { box-shadow: 0 0 4px rgba(239,68,68,0.5); }
    50% { box-shadow: 0 0 10px rgba(239,68,68,0.9); }
  }
  .node.red .node-indicator { animation: pulse-red 2.5s ease-in-out infinite; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2d3a55; border-radius: 3px; }

  .empty-detail {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #2d3a55;
    text-align: center;
    padding: 40px;
  }
  .empty-detail .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-detail p { font-size: 13px; line-height: 1.5; }

  .progress-bar {
    height: 4px;
    background: #1e2740;
    border-radius: 2px;
    margin-top: 12px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
</style>
</head>

<!-- Header -->
<div class="header">

</div>

// ─────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────
let selectedNode = null;
let activeFilter = 'all';

// ─────────────────────────────────────────────────────
// BUILD SUMMARY
// ─────────────────────────────────────────────────────
function buildSummary() {
  let counts = { green: 0, yellow: 0, red: 0, gray: 0 };
  zones.forEach(z => z.nodes.forEach(n => counts[n.status]++));
  const total = Object.values(counts).reduce((a, b) => a + b, 0);

  const labels = { green: 'Wired', yellow: 'Needs Config', red: 'Blocked', gray: 'Optional' };
  const el = document.getElementById('summary');
  el.innerHTML = Object.entries(counts).map(([s, c]) => `
    <div class="badge badge-${s}" data-filter="${s}">
      <span class="dot"></span> ${c} ${labels[s]}
    </div>
  `).join('');

  // Add progress
  const pct = Math.round((counts.green / (total - counts.gray)) * 100);
  el.insertAdjacentHTML('beforeend', `
    <div style="font-size:11px;color:#64748b;margin-left:8px">${pct}% launch-ready</div>
  `);
}

// ─────────────────────────────────────────────────────
// BUILD ZONES
// ─────────────────────────────────────────────────────
function buildZones() {
  const container = document.getElementById('zonesContainer');

  zones.forEach(zone => {
    const zoneEl = document.createElement('div');
    zoneEl.className = 'zone';
    zoneEl.dataset.zoneId = zone.id;

    const nodeCount = zone.nodes.length;
    const wiredCount = zone.nodes.filter(n => n.status === 'green').length;

    zoneEl.innerHTML = `
      <div class="zone-header" style="background: ${zone.color}18; color: ${zone.color}">
        <span class="zone-icon">${zone.icon}</span>
        ${zone.label}
        <span style="margin-left:auto;font-size:10px;color:#475569">${wiredCount}/${nodeCount}</span>
      </div>
      <div class="zone-body" id="zone-body-${zone.id}"></div>
    `;

    const body = zoneEl.querySelector(`#zone-body-${zone.id}`);

    zone.nodes.forEach(node => {
      const tagClass = `tag-${node.status}`;
      const nodeEl = document.createElement('div');
      nodeEl.className = `node ${node.status}`;
      nodeEl.dataset.nodeId = node.id;
      nodeEl.dataset.status = node.status;
      nodeEl.dataset.name = node.name.toLowerCase();

      nodeEl.innerHTML = `
        <div class="node-indicator"></div>
        <div class="node-text">
          <div class="node-name">${node.name}</div>
          <div class="node-sub">${node.sub}</div>
        </div>
        <div class="node-tag ${tagClass}">${node.tag}</div>
      `;

      nodeEl.addEventListener('click', () => selectNode(node, nodeEl));
      body.appendChild(nodeEl);
    });

    container.appendChild(zoneEl);
  });
}

// ─────────────────────────────────────────────────────
// SELECT NODE → show detail
// ─────────────────────────────────────────────────────
function selectNode(node, el) {
  // Deselect previous
  document.querySelectorAll('.node.selected').forEach(n => n.classList.remove('selected'));
  el.classList.add('selected');
  selectedNode = node;

  const statusColors = { green: '#10b981', yellow: '#f59e0b', red: '#ef4444', gray: '#475569' };
  const statusLabels = { green: '✅ Wired & Live', yellow: '⚠️ Needs Configuration', red: '🔴 Not Wired / Blocked', gray: '⬜ Optional' };

  const panel = document.getElementById('detailPanel');
  panel.classList.remove('hidden');

  const zoneLabel = zones.find(z => z.nodes.some(n => n.id === node.id))?.label || '';

  let actionsHtml = '';
  if (node.actions.length > 0) {
    actionsHtml = `
      <div class="detail-section">
        <div class="detail-section-title">Required Actions</div>
        <ul class="action-list">
          ${node.actions.map(a => `<li><span class="bullet">→</span><span>${a}</span></li>`).join('')}
        </ul>
      </div>
    `;
  } else {
    actionsHtml = `
      <div class="detail-section">
        <div class="detail-section-title">Actions</div>
        <p class="detail-desc" style="color:#10b981">✅ No action needed — this is fully wired.</p>
      </div>
    `;
  }

  let envHtml = '';
  if (node.envVars.length > 0) {
    envHtml = `
      <div class="detail-section">
        <div class="detail-section-title">Env Variables</div>
        <div>${node.envVars.map(e => `<span class="env-tag">${e}</span>`).join('')}</div>
      </div>
    `;
  }

  // Progress bar for status
  const pctMap = { green: 100, yellow: 50, red: 0, gray: 0 };
  const pct = pctMap[node.status];
  const barColor = statusColors[node.status];

  document.getElementById('detailInner').innerHTML = `
    <div class="detail-header-row">
      <button class="close-detail" onclick="closeDetail()">✕</button>
      <div class="detail-status">
        <div class="detail-dot" style="background:${statusColors[node.status]}"></div>
        <div class="detail-status-text" style="color:${statusColors[node.status]}">${statusLabels[node.status]}</div>
      </div>
      <div class="detail-name">${node.name}</div>
      <div class="detail-zone">${zoneLabel}</div>
      ${node.status !== 'gray' ? `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${barColor}"></div></div>` : ''}
    </div>

    <div style="margin-top:20px">
      <div class="detail-section">
        <div class="detail-section-title">What Is This</div>
        <p class="detail-desc">${node.desc}</p>
      </div>
      ${actionsHtml}
      ${envHtml}
    </div>
  `;
}

function closeDetail() {
  document.getElementById('detailPanel').classList.add('hidden');
  document.querySelectorAll('.node.selected').forEach(n => n.classList.remove('selected'));
  selectedNode = null;
}

// ─────────────────────────────────────────────────────
// FILTER
// ─────────────────────────────────────────────────────
function applyFilter() {
  const search = document.getElementById('searchBox').value.toLowerCase();

  document.querySelectorAll('.zone').forEach(zoneEl => {
    const nodes = zoneEl.querySelectorAll('.node');
    let anyVisible = false;

    nodes.forEach(nodeEl => {
      const statusMatch = activeFilter === 'all' || nodeEl.dataset.status === activeFilter;
      const searchMatch = !search || nodeEl.dataset.name.includes(search) || nodeEl.querySelector('.node-sub').textContent.toLowerCase().includes(search);
      const visible = statusMatch && searchMatch;
      nodeEl.classList.toggle('hidden', !visible);
      if (visible) anyVisible = true;
    });

    zoneEl.classList.toggle('all-hidden', !anyVisible);
  });
}

// ─────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────
buildSummary();
buildZones();

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    applyFilter();
  });
});

// Search
document.getElementById('searchBox').addEventListener('input', applyFilter);

// Summary badge clicks
document.getElementById('summary').addEventListener('click', e => {
  const badge = e.target.closest('.badge[data-filter]');
  if (!badge) return;
  activeFilter = badge.dataset.filter;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === activeFilter);
  });
  applyFilter();
});
